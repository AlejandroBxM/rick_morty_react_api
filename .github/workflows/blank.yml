# This is a basic workflow to help you get started with Actions
name: CI
# Controls when the workflow will run
on:
  [push, workflow_dispatch] # Triggers the workflow on push or pull request events but only for the "main" branch
  # Allows you to run this workflow manually from the Actions tab
# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  first-job:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      # Steps represent a sequence of tasks that will be executed as part of the job

      # Runs a single command using the runners shell
      - name: Run a one-line script
        run: echo Hello, world!

      # Runs a set of commands using the runners shell
      - name: Run a multi-line script
        run: |
          echo Add other actions to build,
          echo test, and deploy your project.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: get code
        uses: actions/checkout@v3
      - name: Cache
        uses: actions/cache@v3
      - name: install NodeJs
        uses: actions/setup-node@v3
        with:
          node-version: "22"
      - name: install dependencies
        run: npm ci
      - name: lint code
        run: npm run lint
      - name: run tests
        run: npm run test
  build:
      needs: test #se pueden encerrar varios jobs en  []
      runs-on: ubuntu-latest
      outputs:
         script-file: ${{ steps.publish.outputs.script-file }}
      steps:
        - name: get code
          uses: actions/checkout@v3
        - name: install dependencies
          run: npm ci
        - name: Build website
          run: npm run build
        - name: publish JS filename
          id: publish
          run: find dist/assets/*.js -type f -execdir echo "::set-output name=script-file::{}" >> $GITHUB_OUTPUT ';'  
        - name: upload artifacts
          uses: actions/upload-artifact@v3
          with:
            name: dist-files
            path: | 
              dist
              package.json
  deploy:
    needs: [test, build] #se pueden encerrar varios jobs en []
    runs-on: ubuntu-latest
    steps:
      - name: get build artifacts 
        uses: actions/download-artifact@v3
        with:
          name: dist-files
      - name: output contents
        run: ls -R      
      - name: output contents
        run: echo "${{ needs.build.outputs.script-file}}"  
      - name: install NodeJs
        uses: actions/setup-node@v3
        with:
          node-version: "22"
      - name: install dependencies
        run: npm ci
      - name: Build project
        run: npm run build
      - name: Deploy
        run: echo "Deploying to production server..."
